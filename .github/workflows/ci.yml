name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  agent-autofill:
    runs-on: macos-latest
    defaults: { run: { working-directory: agent-autofill } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: agent-autofill/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx -y playwright@1.56.1 install chromium
      - run: npm test
  agent-vault-cdk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agent-vault/aws } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: agent-vault/aws/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
