name: Vault restore (reusable)
# Replace the vault's data with an export from the transfer bucket (see the backup output).
on:
  workflow_call:
    inputs:
      source_repo: { type: string, default: "nyo-solutions/agent-signin", description: "Repo holding this code" }
      source_ref: { type: string, default: "main", description: "Branch, tag or SHA of the code to run" }
      domain: { type: string, required: true, description: "Vault hostname, e.g. vault.example.com" }
      zone_name: { type: string, required: true, description: "Route 53 public hosted zone, e.g. example.com" }
      key: { type: string, required: true, description: "S3 key, e.g. exports/vault-20261106-030000.tar.gz" }
      confirm: { type: string, required: true, description: 'Must be "restore"' }
    secrets:
      aws_role_arn: { required: true, description: "IAM role GitHub OIDC may assume (aws/setup-github.sh)" }
      aws_zone_id: { required: true, description: "Route 53 hosted zone id" }
      alert_email: { required: false }
permissions: { id-token: write, contents: read }
concurrency: { group: agent-vault-aws, cancel-in-progress: false }
jobs:
  restore:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agent-vault/aws } }
    env: { VAULT_DOMAIN: "${{ inputs.domain }}", ZONE_NAME: "${{ inputs.zone_name }}", ZONE_ID: "${{ secrets.aws_zone_id }}" }
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'restore'
        working-directory: .
        run: |
          echo "::error::Confirmation text must be exactly: restore"
          exit 1
      - uses: actions/checkout@v4
        with: { repository: "${{ inputs.source_repo }}", ref: "${{ inputs.source_ref }}" }
      - uses: ./.github/actions/vault-aws-setup
        with: { role-arn: "${{ secrets.aws_role_arn }}", zone-id: "${{ secrets.aws_zone_id }}", domain: "${{ inputs.domain }}" }
      - name: Safety backup, then import
        env: { KEY: "${{ inputs.key }}" }
        run: |
          source lib.sh; FN=$(out AgentVaultData MigrateFunction); VW=$(out AgentVault VaultwardenFunction)
          [[ "$KEY" =~ ^exports/[A-Za-z0-9._-]+\.tar\.gz$ ]] || { echo "::error::key must look like exports/<name>.tar.gz"; exit 1; }
          aws lambda invoke --function-name "$FN" --cli-binary-format raw-in-base64-out --payload '{"action":"export"}' pre.json >/dev/null
          echo "Pre-restore backup: $(jq -r .exported pre.json)" | tee -a "$GITHUB_STEP_SUMMARY"
          # import deletes its source object, so restore from a copy
          aws lambda invoke --function-name "$FN" --cli-binary-format raw-in-base64-out \
            --payload "{\"action\":\"import\",\"key\":\"$KEY\",\"keep\":true}" out.json >/dev/null
          if jq -e .errorMessage out.json >/dev/null; then jq . out.json; exit 1; fi
          jq '{users, items, integrity}' out.json | tee -a "$GITHUB_STEP_SUMMARY"
          [ -n "$VW" ] && {
            ENV=$(aws lambda get-function-configuration --function-name "$VW" --query Environment.Variables --output json | jq -c --arg t "$(date +%s)" '{Variables: (. + {RESTORED_AT: $t})}')
            aws lambda update-function-configuration --function-name "$VW" --environment "$ENV" >/dev/null
            aws lambda wait function-updated --function-name "$VW"; }
