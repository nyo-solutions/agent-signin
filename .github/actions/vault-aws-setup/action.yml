name: Vault AWS + CDK setup
description: Shared setup for the reusable vault workflows. Masks the account id, domain and zone id in logs.
inputs:
  role-arn: { required: true }
  zone-id: { required: true }
  domain: { required: true }
runs:
  using: composite
  steps:
    - name: Check inputs and mask
      shell: bash
      run: |
        if [ -z "${{ inputs.role-arn }}" ] || [ -z "${{ inputs.zone-id }}" ] || [ -z "${{ inputs.domain }}" ]; then
          echo "::error::aws_role_arn, aws_zone_id and domain are required (see agent-vault/ops-template)"; exit 1
        fi
        echo "::add-mask::${{ inputs.domain }}"
        echo "::add-mask::${{ inputs.zone-id }}"
    - uses: actions/setup-node@v4
      with: { node-version: 22, cache: npm, cache-dependency-path: agent-vault/aws/package-lock.json }
    - uses: aws-actions/configure-aws-credentials@v4
      with: { role-to-assume: "${{ inputs.role-arn }}", aws-region: us-east-1, role-session-name: "agent-vault-${{ github.run_id }}", mask-aws-account-id: true }
    - name: Mask account id everywhere
      shell: bash
      run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
    - name: Install CDK deps
      shell: bash
      working-directory: agent-vault/aws
      run: npm ci --no-audit --no-fund
    - name: Extract web vault files from the pinned image
      shell: bash
      working-directory: agent-vault/aws
      run: ./scripts/extract-web-vault.sh
