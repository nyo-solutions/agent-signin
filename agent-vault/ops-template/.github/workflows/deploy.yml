name: Deploy
on:
  workflow_dispatch:
    inputs:
      signups: { description: "Allow new accounts (open briefly, then run again unticked)", type: boolean, default: false }
permissions: { id-token: write, contents: read }
jobs:
  deploy:
    uses: nyo-solutions/agent-signin/.github/workflows/vault-deploy.yml@main
    with:
      domain: ${{ vars.VAULT_DOMAIN }}
      zone_name: ${{ vars.ZONE_NAME }}
      signups: ${{ inputs.signups }}
    secrets:
      aws_role_arn: ${{ vars.AWS_ROLE_ARN }}
      aws_zone_id: ${{ vars.AWS_ZONE_ID }}
      alert_email: ${{ vars.ALERT_EMAIL }}
