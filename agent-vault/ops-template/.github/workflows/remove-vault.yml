name: Remove vault (DELETES DATA)
on:
  workflow_dispatch:
    inputs:
      confirm: { description: 'Type "delete <your vault domain>" to permanently delete the vault', required: true }
      delete_backups: { description: "Also delete AWS Backup snapshots (no way back)", type: boolean, default: false }
permissions: { id-token: write, contents: read }
jobs:
  remove:
    uses: nyo-solutions/agent-signin/.github/workflows/vault-remove.yml@main
    with:
      domain: ${{ vars.VAULT_DOMAIN }}
      zone_name: ${{ vars.ZONE_NAME }}
      confirm: ${{ inputs.confirm }}
      delete_backups: ${{ inputs.delete_backups }}
    secrets:
      aws_role_arn: ${{ vars.AWS_ROLE_ARN }}
      aws_zone_id: ${{ vars.AWS_ZONE_ID }}
      alert_email: ${{ vars.ALERT_EMAIL }}
