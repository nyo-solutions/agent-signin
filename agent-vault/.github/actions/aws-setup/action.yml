name: AWS + CDK setup
description: Shared setup for the agent-vault workflows
inputs:
  role-arn: { description: "vars.AWS_ROLE_ARN", required: false, default: "" }
  zone-id: { description: "vars.AWS_ZONE_ID", required: false, default: "" }
runs:
  using: composite
  steps:
    - name: Check repo variables
      shell: bash
      run: |
        if [ -z "${{ inputs.role-arn }}" ] || [ -z "${{ inputs.zone-id }}" ]; then
          echo "::error::Repo variables AWS_ROLE_ARN / AWS_ZONE_ID are missing. Run aws/setup-github.sh once from your Mac."; exit 1
        fi
    - uses: actions/setup-node@v4
      with: { node-version: 22, cache: npm, cache-dependency-path: aws/package-lock.json }
    - uses: aws-actions/configure-aws-credentials@v4
      with: { role-to-assume: "${{ inputs.role-arn }}", aws-region: us-east-1, role-session-name: "agent-vault-${{ github.run_id }}" }
    - name: Install CDK deps
      shell: bash
      working-directory: aws
      run: npm ci --no-audit --no-fund
    - name: Extract web vault files from the pinned image
      shell: bash
      working-directory: aws
      run: ./scripts/extract-web-vault.sh
