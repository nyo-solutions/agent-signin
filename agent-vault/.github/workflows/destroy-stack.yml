name: Take vault offline (keep data)
# Removes the public endpoint, Lambda, certificate and DNS record (stack AgentVault).
# Vault data (EFS, backups, transfer bucket) is kept; run Deploy to bring it back with the same data.
on:
  workflow_dispatch:
    inputs:
      confirm: { description: 'Type "destroy" to take vault.example.com offline', required: true }
permissions: { id-token: write, contents: read }
concurrency: { group: agent-vault-aws, cancel-in-progress: false }
jobs:
  destroy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: aws } }
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'destroy'
        run: |
          echo "::error::Confirmation text must be exactly: destroy"
          exit 1
      - uses: actions/checkout@v4
      - uses: ./.github/actions/aws-setup
        with: { role-arn: "${{ vars.AWS_ROLE_ARN }}", zone-id: "${{ vars.AWS_ZONE_ID }}" }
      - name: Backup first
        run: |
          source lib.sh; FN=$(out AgentVaultData MigrateFunction)
          [ -z "$FN" ] && exit 0
          aws lambda invoke --function-name "$FN" --cli-binary-format raw-in-base64-out --payload '{"action":"export"}' out.json >/dev/null
          jq -e .exported out.json && echo "Backup: $(jq -r .exported out.json)" >> "$GITHUB_STEP_SUMMARY"
      - name: cdk destroy AgentVault
        env: { ZONE_ID: "${{ vars.AWS_ZONE_ID }}" }
        run: |
          source lib.sh
          stack_exists AgentVault || { echo "AgentVault is not deployed"; exit 0; }
          npx cdk destroy AgentVault -c zoneId="$ZONE_ID" --force
          echo "vault.example.com is offline; data kept. Run Deploy to restore." >> "$GITHUB_STEP_SUMMARY"
